<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --bg:#F0E1D2;
    --card:#FAF3E9;
    --brown:#8A4A38;
    --brown-dark:#5C2E22;
    --ink:#4A2A1F;
    --line:rgba(90,46,34,0.16);
    --accent:#B5694E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  header{
    padding:34px 20px 22px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header .logo{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
  }
  header .logo svg{ height:46px; width:auto; }
  header .mark{
    font-family:'Poppins',sans-serif;
    font-weight:800;
    font-size:30px;
    letter-spacing:4px;
    color:var(--brown-dark);
  }
  header .tag{
    font-size:11.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--accent);
    margin-top:6px;
    font-weight:600;
  }

  .catnav{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .catnav::-webkit-scrollbar{ display:none; }
  .catnav button{
    flex:none;
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--brown-dark);
    font-family:'Poppins',sans-serif;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
  }
  .catnav button.active{
    background:var(--brown);
    border-color:var(--brown);
    color:#fff;
  }

  .item.soldout{ opacity:0.5; }
  .soldout-tag{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--accent);
  }

  .menu{
    padding:20px 16px 150px;
    max-width:520px;
    margin:0 auto;
  }
  .cat{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--brown);
    margin:30px 0 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cat::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    margin-bottom:8px;
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--line);
  }
  .item-info h3{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 3px;
    color:var(--brown-dark);
  }
  .item-info p{
    margin:0;
    font-size:12.5px;
    color:rgba(74,42,31,0.55);
  }
  .item-price{
    font-size:14px;
    font-weight:600;
    color:var(--accent);
    white-space:nowrap;
    margin-left:8px;
  }

  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:92px;
    justify-content:flex-end;
  }
  .stepper button{
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--brown);
    background:transparent;
    color:var(--brown);
    font-size:16px;
    line-height:1;
    cursor:pointer;
  }
  .stepper button:active{ background:var(--brown); color:var(--card); }
  .stepper .qty{ min-width:14px; text-align:center; font-size:14px; font-weight:600; }

  .addbtn{
    padding:6px 14px;
    border-radius:20px;
    border:1px solid var(--brown);
    background:transparent;
    color:var(--brown);
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }

  .cartbar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--card);
    border-top:1px solid var(--line);
    box-shadow:0 -6px 20px rgba(90,46,34,0.08);
    padding:14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:520px;
    margin:0 auto;
  }
  .cartbar.hidden{ display:none; }
  .cartbar .total{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:16px;
    color:var(--brown-dark);
  }
  .cartbar .total span{ color:var(--accent); }
  .sendbtn{
    background:linear-gradient(135deg,#25D366,#1EBE5A);
    color:#0e2b16;
    border:none;
    padding:12px 20px;
    border-radius:30px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .note{
    max-width:520px;
    margin:24px auto 0;
    padding:0 16px;
    font-size:12px;
    color:rgba(74,42,31,0.5);
    text-align:center;
  }
</style>

// ── Live menu (starts as the default above, overwritten if the admin panel has published changes) ──
let MENU = JSON.parse(JSON.stringify(DEFAULT_MENU));

// ── Firebase config — same project used by the Browletto admin panel. Fill in once, admin edits then show up here automatically. ──
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
let db = null;
let firebaseReady = false;
try {
  if (typeof firebase !== 'undefined' && firebaseConfig.projectId !== "YOUR_PROJECT_ID") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }
} catch (e) { console.warn('Firebase not configured yet, using built-in menu.', e); }

const LS_KEY = 'browletto_menu_categories_v1';

async function loadLiveMenu(){
  // Same-device testing: if the admin panel was used in this browser without Firebase set up,
  // pick up its local backup so you can preview changes before going live.
  if (!firebaseReady) {
    const local = localStorage.getItem(LS_KEY);
    if (local) {
      try { MENU = JSON.parse(local); } catch(e) {}
    }
    render();
    return;
  }
  try {
    const doc = await db.collection('browletto').doc('menu').get();
    if (doc.exists && doc.data().categories) {
      MENU = doc.data().categories;
    }
  } catch (e) {
    console.warn('Could not load live menu, using default.', e);
  }
  render();
  // Keep menu live-updated if admin makes a change while a customer is browsing
  if (db) {
    db.collection('browletto').doc('menu').onSnapshot(doc => {
      if (doc.exists && doc.data().categories) {
        MENU = doc.data().categories;
        render();
      }
    });
  }
}

    const btn = document.createElement('button');
    btn.textContent = section.cat;
    btn.dataset.target = slug(section.cat);
    btn.onclick = () => {
      document.getElementById('sec-' + slug(section.cat))
        .scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    nav.appendChild(btn);
  });
}

function render(){
  renderNav();
  const menuEl = document.getElementById('menu');
  menuEl.innerHTML = '';
  MENU.forEach(section => {
    const secWrap = document.createElement('div');
    secWrap.id = 'sec-' + slug(section.cat);

    const catEl = document.createElement('div');
    catEl.className = 'cat';
    catEl.textContent = section.cat;
    secWrap.appendChild(catEl);

    section.items.forEach(it => {
      const isSoldOut = it.available === false;
      const qty = cart[it.name]?.qty || 0;
      const row = document.createElement('div');
      row.className = 'item' + (isSoldOut ? ' soldout' : '');
      row.innerHTML = `
        <div class="item-info">
          <h3>${it.name}</h3>
          <p>${it.desc || ''}</p>
          <div class="item-price">₹${it.price}</div>
        </div>
        <div class="control"></div>
      `;
      const control = row.querySelector('.control');
      if (isSoldOut) {
        const tag = document.createElement('span');
        tag.className = 'soldout-tag';
        tag.textContent = 'Sold out';
        control.appendChild(tag);
      } else if (qty === 0) {
        const btn = document.createElement('button');
        btn.className = 'addbtn';
        btn.textContent = 'Add +';
        btn.onclick = () => { setQty(it, 1); };
        control.appendChild(btn);
      } else {
        control.innerHTML = `
          <div class="stepper">
            <button class="minus">−</button>
            <span class="qty">${qty}</span>
            <button class="plus">+</button>
          </div>`;
        control.querySelector('.minus').onclick = () => setQty(it, qty - 1);
        control.querySelector('.plus').onclick = () => setQty(it, qty + 1);
      }
      secWrap.appendChild(row);
    });
    menuEl.appendChild(secWrap);
  });
  updateCartBar();
  setupActiveNavTracking();
}

let navObserver = null;
function setupActiveNavTracking(){
  if (navObserver) navObserver.disconnect();
  const navButtons = [...document.querySelectorAll('#catnav button')];
  navObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id.replace('sec-', '');
        navButtons.forEach(b => b.classList.toggle('active', b.dataset.target === id));
      }
    });
  }, { rootMargin: '-100px 0px -70% 0px' });
  document.querySelectorAll('.menu > div[id^="sec-"]').forEach(sec => navObserver.observe(sec));
}

function setQty(item, qty){
  if(qty <= 0){ delete cart[item.name]; }
  else { cart[item.name] = { qty, price: item.price }; }
  render();
}

function updateCartBar(){
  const bar = document.getElementById('cartbar');
  const entries = Object.entries(cart);
  if(entries.length === 0){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const total = entries.reduce((sum,[,v]) => sum + v.qty * v.price, 0);
  document.getElementById('totalAmt').textContent = `₹${total}`;
}

document.getElementById('sendBtn').onclick = () => {
  const entries = Object.entries(cart);
  if(entries.length === 0) return;
  let msg = "Hi Browletto! I'd like to order:\n\n";
  let total = 0;
  entries.forEach(([name, v]) => {
    msg += `• ${name} x${v.qty} — ₹${v.qty * v.price}\n`;
    total += v.qty * v.price;
  });
  msg += `\nTotal: ₹${total}\n\nName:\nDelivery address:\nPayment: UPI / COD`;

  if (db) {
    db.collection('browletto_orders').add({
      items: entries.map(([name, v]) => ({ name, qty: v.qty, price: v.price })),
      total,
      status: 'new',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(e => console.warn('Order log failed (order still sends on WhatsApp):', e));
  }

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
};

loadLiveMenu();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW registration failed', e));
  });
}
</script>
