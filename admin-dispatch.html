<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browletto — Delivery Dispatch</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#2B1810; --choc:#6B3F2A; --cream:#F6E9D8; --gold:#C9973E;
    --green:#3F7A5C; --red:#B3452C; --amber:#B3812C;
    --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--dark); font-family:var(--font-body); padding-bottom:40px;}
  header{background:var(--dark); color:var(--cream); padding:18px 20px;}
  header h1{font-family:var(--font-display); font-size:20px; margin:0;}
  header .sub{font-size:12px; opacity:0.65; margin-top:2px;}
  #lockScreen{padding:60px 24px; text-align:center;}
  #lockScreen input{padding:12px; border-radius:10px; border:1px solid rgba(43,24,16,0.2); font-size:16px; width:200px; text-align:center;}
  #lockScreen button{margin-top:12px; display:block; margin-left:auto; margin-right:auto; background:var(--dark); color:var(--cream); border:none; padding:11px 22px; border-radius:10px; font-weight:600; cursor:pointer;}

  .filters{display:flex; gap:8px; padding:14px 16px; overflow-x:auto;}
  .filter{padding:7px 14px; border-radius:20px; background:#fff; border:1px solid rgba(43,24,16,0.15); font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer;}
  .filter.active{background:var(--dark); color:var(--cream); border-color:var(--dark);}

  main{padding:0 16px;}
  .order-card{background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:12px; border:1px solid rgba(43,24,16,0.08);}
  .order-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .oid{font-family:var(--font-mono); font-weight:700; font-size:13px;}
  .otime{font-size:10.5px; opacity:0.6; margin-top:2px;}
  .badge{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:0.3px;}
  .badge.placed{background:rgba(179,69,44,0.12); color:var(--red);}
  .badge.preparing{background:rgba(179,129,44,0.14); color:var(--amber);}
  .badge.ready{background:rgba(201,151,62,0.18); color:var(--gold);}
  .badge.dispatched{background:rgba(63,122,89,0.14); color:var(--green);}
  .badge.delivered{background:rgba(63,122,89,0.25); color:var(--green);}

  .cust{margin-top:10px; font-size:13.5px; font-weight:600;}
  .addr{font-size:12.5px; opacity:0.8; margin-top:2px; line-height:1.4;}
  .items{margin-top:10px; font-size:12.5px; border-top:1px dashed rgba(43,24,16,0.15); padding-top:8px;}
  .items div{display:flex; justify-content:space-between; padding:2px 0;}
  .total-row{display:flex; justify-content:space-between; font-weight:700; font-size:13.5px; margin-top:8px; border-top:1px solid rgba(43,24,16,0.1); padding-top:8px;}

  .actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .actions button{flex:1; min-width:100px; padding:10px; border-radius:10px; border:none; font-size:12.5px; font-weight:700; cursor:pointer;}
  .btn-prep{background:var(--amber); color:#fff;}
  .btn-ready{background:var(--gold); color:var(--dark);}
  .btn-dispatch{background:var(--green); color:#fff;}
  .btn-call{background:var(--dark); color:var(--cream);}
  .btn-wa{background:#25D366; color:#fff;}

  .empty{text-align:center; padding:60px 20px; opacity:0.5; font-size:13.5px;}
</style>
</head>
<body>

<div id="lockScreen">
  <div style="font-family:var(--font-display); font-size:22px; margin-bottom:14px;">Browletto Dispatch</div>
  <input type="password" id="pinInput" placeholder="Enter admin PIN" maxlength="12" />
  <button onclick="checkPin()">Unlock</button>
</div>

<div id="dashboard" style="display:none;">
  <header>
    <h1>Delivery Dispatch</h1>
    <div class="sub" id="orderCountLabel">Live orders</div>
  </header>
  <div class="filters" id="filters"></div>
  <main id="ordersRoot"><div class="empty">Loading orders…</div></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const CFG = window.BROWLETTO_CONFIG || {};
const ADMIN_PIN = CFG.adminPin || "browletto123"; // ⚠️ change this in config.js by adding adminPin: "yourpin"

function checkPin(){
  const val = document.getElementById('pinInput').value;
  if (val === ADMIN_PIN){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('dashboard').style.display='block';
    initDashboard();
  } else {
    alert('Wrong PIN');
  }
}

const STATUS_FLOW = ['placed','preparing','ready','dispatched','delivered'];
const STATUS_LABEL = {placed:'New', preparing:'Preparing', ready:'Ready', dispatched:'Dispatched', delivered:'Delivered'};
let currentFilter = 'active'; // active = placed/preparing/ready/dispatched
let allOrders = [];

function initDashboard(){
  const filtersEl = document.getElementById('filters');
  const filterDefs = [
    {key:'active', label:'Active'},
    {key:'placed', label:'New'},
    {key:'preparing', label:'Preparing'},
    {key:'ready', label:'Ready'},
    {key:'dispatched', label:'Dispatched'},
    {key:'delivered', label:'Delivered'},
  ];
  filterDefs.forEach(f=>{
    const btn = document.createElement('div');
    btn.className = 'filter' + (f.key==='active' ? ' active':'');
    btn.textContent = f.label;
    btn.onclick = ()=>{
      document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = f.key;
      renderOrders();
    };
    filtersEl.appendChild(btn);
  });

  if (!CFG.firebaseConfig || !CFG.firebaseConfig.apiKey){
    document.getElementById('ordersRoot').innerHTML = '<div class="empty">Firebase isn\'t configured yet — add your project details in config.js to see live orders here.</div>';
    return;
  }

  firebase.initializeApp(CFG.firebaseConfig);
  const db = firebase.firestore();
  db.collection('orders').where('orderType','==','delivery').orderBy('createdAt','desc')
    .onSnapshot(snap=>{
      allOrders = [];
      snap.forEach(doc=> allOrders.push({id:doc.id, ...doc.data()}));
      renderOrders();
    }, err=>{
      document.getElementById('ordersRoot').innerHTML = '<div class="empty">Could not load orders: '+err.message+'</div>';
    });

  window.updateStatus = async (orderId, newStatus)=>{
    await db.collection('orders').doc(orderId).update({status:newStatus});
  };
}

function renderOrders(){
  const root = document.getElementById('ordersRoot');
  let list = allOrders;
  if (currentFilter === 'active'){
    list = allOrders.filter(o=>['placed','preparing','ready','dispatched'].includes(o.status));
  } else {
    list = allOrders.filter(o=>o.status === currentFilter);
  }
  document.getElementById('orderCountLabel').textContent = list.length + ' order' + (list.length===1?'':'s');

  if (list.length === 0){
    root.innerHTML = '<div class="empty">No orders here right now.</div>';
    return;
  }

  root.innerHTML = '';
  list.forEach(o=>{
    const itemsHtml = (o.items||[]).map(i=>`<div><span>${i.name} ×${i.qty}</span><span>₹${i.price*i.qty}</span></div>`).join('');
    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `
      <div class="order-top">
        <div>
          <div class="oid">#${o.orderId||o.id}</div>
          <div class="otime">${o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().toLocaleString() : ''}</div>
        </div>
        <div class="badge ${o.status}">${STATUS_LABEL[o.status]||o.status}</div>
      </div>
      <div class="cust">${o.name || ''} · ${o.phone || ''}</div>
      <div class="addr">${o.address || ''}</div>
      <div class="items">${itemsHtml}</div>
      <div class="total-row"><span>Total (${o.payment||''})</span><span>₹${o.total||0}</span></div>
      <div class="actions" id="actions-${o.id}"></div>
    `;
    root.appendChild(card);
    renderActions(o);
  });
}

function renderActions(o){
  const el = document.getElementById('actions-'+o.id);
  const buttons = [];
  const idx = STATUS_FLOW.indexOf(o.status);

  if (o.status === 'placed') buttons.push(`<button class="btn-prep" onclick="updateStatus('${o.id}','preparing')">Start Preparing</button>`);
  if (o.status === 'preparing') buttons.push(`<button class="btn-ready" onclick="updateStatus('${o.id}','ready')">Mark Ready</button>`);
  if (o.status === 'ready') buttons.push(`<button class="btn-dispatch" onclick="updateStatus('${o.id}','dispatched')">Dispatch to Rider</button>`);
  if (o.status === 'dispatched') buttons.push(`<button class="btn-dispatch" onclick="updateStatus('${o.id}','delivered')">Mark Delivered</button>`);

  if (o.phone){
    buttons.push(`<button class="btn-call" onclick="window.location.href='tel:${o.phone}'">Call Customer</button>`);
    const waMsg = encodeURIComponent(`Hi ${o.name}, your Browletto order #${o.orderId||o.id} is ${STATUS_LABEL[o.status]||o.status}!`);
    buttons.push(`<button class="btn-wa" onclick="window.open('https://wa.me/91${o.phone}?text=${waMsg}','_blank')">WhatsApp</button>`);
  }
  el.innerHTML = buttons.join('');
}
</script>
</body>
</html>
